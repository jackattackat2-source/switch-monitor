<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch Monitor</title>
<style>
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; background:#000; color:#fff;
               font-family:system-ui,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:grid; place-items:center; background:#000; }
  video { width:100%; height:100%; object-fit:contain; background:#000; transition:transform .15s; }
  #controls {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    padding:10px 12px; border-radius:14px; background:rgba(20,20,20,.9);
    max-width:calc(100vw - 24px); z-index:10;
  }
  button, select {
    border:0; border-radius:9px; padding:9px 12px; font-size:14px;
    background:#fff; color:#111; cursor:pointer;
  }
  button:hover { background:#ddd; }
  #status { font-size:13px; opacity:.85; }
  #error {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    max-width:90vw; padding:10px 14px; border-radius:10px;
    background:#8b0000; display:none; z-index:20;
  }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline></video>
</div>

<div id="error"></div>

<div id="controls">
  <button id="start">Start</button>
  <select id="camera" title="Video device"></select>
  <button id="mirror">Mirror: Off</button>
  <button id="rotate">Rotate: 0°</button>
  <button id="fullscreen">Fullscreen</button>
  <span id="status">Choose your HDMI capture device.</span>
</div>

<script>
let stream = null;
let mirrored = false;
let rotation = 0;

const video = document.getElementById('video');
const camera = document.getElementById('camera');
const controls = document.getElementById('controls');
const status = document.getElementById('status');
const errorBox = document.getElementById('error');

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = 'block';
}
function clearError() {
  errorBox.style.display = 'none';
}
function updateTransform() {
  video.style.transform =
    `rotate(${rotation}deg) scaleX(${mirrored ? -1 : 1})`;
}
function stopStream() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
}
async function loadDevices() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const old = camera.value;
  camera.innerHTML = '';
  const videos = devices.filter(d => d.kind === 'videoinput');
  videos.forEach((d, i) => {
    const option = document.createElement('option');
    option.value = d.deviceId;
    option.textContent = d.label || `Video device ${i + 1}`;
    camera.appendChild(option);
  });
  if (videos.some(d => d.deviceId === old)) camera.value = old;
  return videos;
}
async function startCamera() {
  clearError();
  stopStream();
  try {
    // Ask for permission first so Chrome can reveal device names.
    await navigator.mediaDevices.getUserMedia({video:true, audio:false});
    const devices = await loadDevices();
    if (!devices.length) throw new Error('No video device was found.');
    const id = camera.value || devices[0].deviceId;
    stream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: { exact: id } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    status.textContent = 'Live';
  } catch (e) {
    showError('Could not open the capture device: ' + (e.message || e.name));
    status.textContent = 'Not connected';
  }
}

document.getElementById('start').onclick = startCamera;

camera.onchange = startCamera;

document.getElementById('mirror').onclick = () => {
  mirrored = !mirrored;
  document.getElementById('mirror').textContent =
    `Mirror: ${mirrored ? 'On' : 'Off'}`;
  updateTransform();
};

document.getElementById('rotate').onclick = () => {
  rotation = (rotation + 90) % 360;
  document.getElementById('rotate').textContent = `Rotate: ${rotation}°`;
  updateTransform();
};

document.getElementById('fullscreen').onclick = async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) {
    showError('Fullscreen was blocked by the browser.');
  }
};

document.addEventListener('fullscreenchange', () => {
  controls.classList.toggle('hidden', !!document.fullscreenElement);
});

window.addEventListener('load', async () => {
  if (!navigator.mediaDevices?.getUserMedia) {
    showError('Camera access is not available here. Open this page from HTTPS or a local file.');
    return;
  }
  try { await loadDevices(); } catch {}
});
</script>
</body>
</html>
