<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Switch Monitor</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#screen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

#video {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center;

    background: black;
}

#controls {
    position: fixed;

    left: 50%;
    bottom: 15px;

    transform: translateX(-50%);

    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;

    gap: 8px;

    padding: 10px 12px;

    background: rgba(20, 20, 20, 0.92);

    border-radius: 12px;

    z-index: 10;

    font-family: Arial, sans-serif;
}

button,
select {
    border: none;
    border-radius: 8px;

    padding: 9px 12px;

    font-size: 14px;

    background: white;
    color: black;
}

button {
    cursor: pointer;
}

button:hover {
    background: #ddd;
}

#status {
    color: white;
    font-size: 13px;
    white-space: nowrap;
}

#error {
    position: fixed;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    max-width: 90vw;

    padding: 10px 15px;

    background: #900;
    color: white;

    border-radius: 8px;

    display: none;

    z-index: 20;

    font-family: Arial, sans-serif;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="screen">

    <video
        id="video"
        autoplay
        playsinline>
    </video>

</div>


<div id="error"></div>


<div id="controls">

    <button id="start">
        Start
    </button>

    <select id="camera">
        <option value="">
            Select capture device
        </option>
    </select>

    <button id="fullscreen">
        Fullscreen
    </button>

    <span id="status">
        Not connected
    </span>

</div>


<script>

let stream = null;

const video =
    document.getElementById("video");

const camera =
    document.getElementById("camera");

const controls =
    document.getElementById("controls");

const status =
    document.getElementById("status");

const errorBox =
    document.getElementById("error");


/* =========================
   ERROR DISPLAY
========================= */

function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";
}


function clearError() {

    errorBox.style.display = "none";
}


/* =========================
   STOP CURRENT STREAM
========================= */

function stopStream() {

    if (stream) {

        stream.getTracks().forEach(track => {
            track.stop();
        });

    }

    stream = null;

    video.srcObject = null;
}


/* =========================
   GET VIDEO DEVICES
========================= */

async function loadDevices() {

    const devices =
        await navigator.mediaDevices.enumerateDevices();


    const previousDevice =
        camera.value;


    camera.innerHTML = "";


    const firstOption =
        document.createElement("option");

    firstOption.value = "";

    firstOption.textContent =
        "Select capture device";

    camera.appendChild(firstOption);


    const videoDevices =
        devices.filter(
            device =>
                device.kind === "videoinput"
        );


    videoDevices.forEach((device, index) => {

        const option =
            document.createElement("option");


        option.value =
            device.deviceId;


        /*
         * Chrome may hide the device name
         * until permission is granted.
         */
        option.textContent =
            device.label ||
            `Video device ${index + 1}`;


        camera.appendChild(option);

    });


    /*
     * Keep the previously selected device
     * if it still exists.
     */
    if (
        videoDevices.some(
            device =>
                device.deviceId ===
                previousDevice
        )
    ) {

        camera.value =
            previousDevice;

    }


    return videoDevices;
}


/* =========================
   START SELECTED DEVICE
========================= */

async function startSelectedDevice() {

    clearError();


    const deviceId =
        camera.value;


    if (!deviceId) {

        showError(
            "Select your USB HDMI capture device first."
        );

        return;
    }


    stopStream();


    try {

        status.textContent =
            "Connecting...";


        /*
         * IMPORTANT:
         *
         * We request ONLY the device
         * selected in the dropdown.
         *
         * We do NOT call:
         *
         * getUserMedia({video:true})
         *
         * because that can select the
         * Chromebook's built-in camera.
         */
        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        deviceId: {
                            exact: deviceId
                        }
                    },

                    audio: false

                });


        /*
         * Put the selected USB capture
         * stream into the video element.
         */
        video.srcObject =
            stream;


        /*
         * Wait for the video to load.
         */
        await new Promise((resolve, reject) => {

            if (video.readyState >= 1) {

                resolve();

                return;
            }


            video.onloadedmetadata =
                () => resolve();


            setTimeout(() => {

                if (video.readyState < 1) {

                    reject(
                        new Error(
                            "Video did not start."
                        )
                    );

                }

            }, 5000);

        });


        await video.play();


        status.textContent =
            "Switch Live";


        console.log(
            "Capture resolution:",
            video.videoWidth,
            "x",
            video.videoHeight
        );


    } catch (error) {

        console.error(error);


        stopStream();


        status.textContent =
            "Connection failed";


        showError(
            "Could not open the selected USB capture device: " +
            (error.message || error.name)
        );

    }
}


/* =========================
   INITIAL DEVICE SETUP
========================= */

async function initializeDevices() {

    try {

        /*
         * We intentionally DON'T request
         * a generic camera here.
         *
         * That was causing Chrome to
         * switch to the Chromebook camera.
         */

        const devices =
            await loadDevices();


        if (devices.length === 0) {

            status.textContent =
                "No video devices found.";

            return;
        }


        /*
         * Try to automatically select
         * a likely USB/HDMI capture device.
         */
        const capture =
            devices.find(device => {

                const name =
                    (device.label || "")
                        .toLowerCase();


                return (
                    name.includes("capture") ||
                    name.includes("hdmi") ||
                    name.includes("usb video") ||
                    name.includes("usb capture")
                );

            });


        if (capture) {

            camera.value =
                capture.deviceId;

        }


    } catch (error) {

        console.error(error);

        status.textContent =
            "Waiting for device permission.";

    }
}


/* =========================
   START BUTTON
========================= */

document
    .getElementById("start")
    .addEventListener(
        "click",
        async () => {

            /*
             * If device names aren't available yet,
             * get permission for the selected device.
             */
            if (!camera.value) {

                showError(
                    "Select the USB HDMI capture device."
                );

                return;
            }


            await startSelectedDevice();

        }
    );


/* =========================
   DEVICE DROPDOWN
========================= */

camera.addEventListener(
    "change",
    async () => {

        /*
         * Selecting a device immediately
         * connects to THAT device.
         */
        if (camera.value) {

            await startSelectedDevice();

        }

    }
);


/* =========================
   FULLSCREEN
========================= */

document
    .getElementById("fullscreen")
    .addEventListener(
        "click",
        async () => {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                } else {

                    await document
                        .exitFullscreen();

                }

            } catch (error) {

                showError(
                    "Fullscreen was blocked by the browser."
                );

            }

        }
    );


/* =========================
   FULLSCREEN CONTROLS
========================= */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (document.fullscreenElement) {

            controls.classList.add(
                "hidden"
            );

        } else {

            controls.classList.remove(
                "hidden"
            );

        }

    }
);


/* =========================
   PAGE LOAD
========================= */

window.addEventListener(
    "load",
    async () => {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            showError(
                "Camera access is not available. " +
                "Make sure you are using the HTTPS GitHub Pages website."
            );

            return;
        }


        await initializeDevices();

    }
);


/* =========================
   CLEAN UP WHEN LEAVING
========================= */

window.addEventListener(
    "beforeunload",
    () => {

        stopStream();

    }
);

</script>

</body>
</html>
