<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Switch Monitor</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #viewer {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        background: #000;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    #video {
        width: 100%;
        height: 100%;

        display: block;

        object-fit: contain;
        object-position: center;

        background: #000;
    }

    #panel {
        position: fixed;

        left: 50%;
        bottom: 20px;

        transform: translateX(-50%);

        background: rgba(25, 25, 25, 0.95);

        padding: 12px;

        border-radius: 12px;

        display: flex;
        align-items: center;
        gap: 8px;

        z-index: 10;
    }

    select,
    button {
        border: 0;
        border-radius: 8px;

        padding: 9px 12px;

        font-size: 14px;
    }

    button {
        cursor: pointer;
    }

    #status {
        color: white;
        font-size: 13px;
        margin-left: 5px;
    }

    #message {
        position: fixed;

        top: 20px;
        left: 50%;

        transform: translateX(-50%);

        background: rgba(30, 30, 30, 0.95);

        color: white;

        padding: 12px 16px;

        border-radius: 10px;

        display: none;

        z-index: 20;
    }

    .hide {
        display: none !important;
    }
</style>
</head>

<body>

<div id="viewer">
    <video
        id="video"
        autoplay
        playsinline>
    </video>
</div>

<div id="message"></div>

<div id="panel">

    <select id="devices">
        <option>Loading devices...</option>
    </select>

    <button id="start">
        Start
    </button>

    <button id="fullscreen">
        Fullscreen
    </button>

    <span id="status">
        Ready
    </span>

</div>


<script>

const video =
    document.getElementById("video");

const devices =
    document.getElementById("devices");

const startButton =
    document.getElementById("start");

const fullscreenButton =
    document.getElementById("fullscreen");

const panel =
    document.getElementById("panel");

const status =
    document.getElementById("status");

const message =
    document.getElementById("message");


let currentStream = null;


/* ----------------------------------
   Message
---------------------------------- */

function showMessage(text) {

    message.textContent = text;

    message.style.display = "block";

}


function hideMessage() {

    message.style.display = "none";

}


/* ----------------------------------
   Stop video
---------------------------------- */

function stopVideo() {

    if (currentStream) {

        currentStream
            .getTracks()
            .forEach(track => {
                track.stop();
            });

        currentStream = null;
    }

    video.srcObject = null;

}


/* ----------------------------------
   Load devices
---------------------------------- */

async function refreshDevices() {

    try {

        const list =
            await navigator
                .mediaDevices
                .enumerateDevices();


        const videoDevices =
            list.filter(
                device =>
                    device.kind === "videoinput"
            );


        devices.innerHTML = "";


        if (videoDevices.length === 0) {

            const option =
                document.createElement("option");

            option.textContent =
                "No video devices found";

            option.value = "";

            devices.appendChild(option);

            return;
        }


        videoDevices.forEach(
            (device, index) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    device.deviceId;


                option.textContent =
                    device.label ||
                    `Video device ${index + 1}`;


                devices.appendChild(option);

            }
        );


        /*
         * Prefer the USB capture card
         * when Chrome gives us its name.
         */
        const capture =
            videoDevices.find(device => {

                const name =
                    (device.label || "")
                        .toLowerCase();

                return (
                    name.includes("capture") ||
                    name.includes("hdmi") ||
                    name.includes("usb video") ||
                    name.includes("usb capture")
                );

            });


        if (capture) {

            devices.value =
                capture.deviceId;

        }

    }

    catch (error) {

        console.error(error);

        showMessage(
            "Could not read video devices."
        );

    }

}


/* ----------------------------------
   Start selected video device
---------------------------------- */

async function startVideo() {

    hideMessage();

    stopVideo();


    const deviceId =
        devices.value;


    if (!deviceId) {

        showMessage(
            "Choose your USB capture device."
        );

        return;

    }


    status.textContent =
        "Connecting...";


    try {

        /*
         * This is the important part:
         *
         * We explicitly tell Chrome which
         * video input to use.
         */
        const constraints = {

            video: {

                deviceId: {
                    exact: deviceId
                },

                /*
                 * Don't force a resolution.
                 * Let the capture card choose
                 * its supported mode.
                 */
                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                },

                frameRate: {
                    ideal: 60
                }

            },

            audio: false

        };


        currentStream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    constraints
                );


        video.srcObject =
            currentStream;


        await video.play();


        status.textContent =
            "LIVE";


        console.log(
            "Capture resolution:",
            video.videoWidth,
            "x",
            video.videoHeight
        );


        /*
         * If the capture card disconnects,
         * tell the user instead of leaving
         * a frozen picture.
         */
        currentStream
            .getVideoTracks()[0]
            .addEventListener(
                "ended",
                () => {

                    status.textContent =
                        "Signal lost";

                }
            );

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Failed";

        showMessage(
            "Could not open the capture card: " +
            error.name
        );

    }

}


/* ----------------------------------
   Start button
---------------------------------- */

startButton.addEventListener(
    "click",
    startVideo
);


/* ----------------------------------
   Selecting a different device
---------------------------------- */

devices.addEventListener(
    "change",
    startVideo
);


/* ----------------------------------
   Fullscreen
---------------------------------- */

fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document
                    .documentElement
                    .requestFullscreen();

            }

            else {

                await document
                    .exitFullscreen();

            }

        }

        catch (error) {

            showMessage(
                "Fullscreen could not be started."
            );

        }

    }
);


/* ----------------------------------
   Hide controls in fullscreen
---------------------------------- */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (
            document.fullscreenElement
        ) {

            panel.classList.add(
                "hide"
            );

        }

        else {

            panel.classList.remove(
                "hide"
            );

        }

    }
);


/* ----------------------------------
   When the page opens
---------------------------------- */

async function initialize() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        showMessage(
            "Camera/video access is unavailable. " +
            "Make sure you're using the HTTPS GitHub Pages address."
        );

        return;

    }


    /*
     * Get permission once.
     *
     * This is needed because Chrome may hide
     * device names before permission is granted.
     */
    try {

        const temporary =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: true,
                    audio: false

                });


        temporary
            .getTracks()
            .forEach(track => {
                track.stop();
            });

    }

    catch (error) {

        console.error(error);

        showMessage(
            "Camera/capture permission is required."
        );

        return;

    }


    /*
     * Now that permission exists,
     * Chrome exposes the device names.
     */
    await refreshDevices();

}


window.addEventListener(
    "load",
    initialize
);


/* ----------------------------------
   Refresh devices if Chrome changes
   the connected USB devices.
---------------------------------- */

navigator
    .mediaDevices
    .addEventListener(
        "devicechange",
        refreshDevices
    );


/* ----------------------------------
   Clean up
---------------------------------- */

window.addEventListener(
    "beforeunload",
    stopVideo
);

</script>

</body>
</html>
