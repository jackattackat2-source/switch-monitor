<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Switch Monitor</title>

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
        overflow: hidden;
    }

    #screen {
        width: 100vw;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: black;
        overflow: hidden;
    }

    #video {
        display: block;

        /*
         * IMPORTANT:
         * Do NOT force the video to be both
         * 100% wide AND 100% tall.
         *
         * Let the browser keep the video's
         * natural aspect ratio.
         */
        width: auto;
        height: auto;

        max-width: 100%;
        max-height: 100%;

        object-fit: contain;

        background: black;
    }

    #controls {
        position: fixed;

        bottom: 15px;
        left: 50%;

        transform: translateX(-50%);

        display: flex;
        align-items: center;
        gap: 8px;

        padding: 10px;

        background: rgba(20, 20, 20, 0.9);

        border-radius: 12px;

        z-index: 10;
    }

    button,
    select {
        padding: 8px 12px;

        border: none;
        border-radius: 8px;

        font-size: 14px;
    }

    button {
        cursor: pointer;
    }

    #status {
        color: white;
        font-family: Arial, sans-serif;
        font-size: 13px;
    }

    #error {
        position: fixed;

        top: 15px;
        left: 50%;

        transform: translateX(-50%);

        background: #900;
        color: white;

        padding: 10px 15px;

        border-radius: 8px;

        font-family: Arial, sans-serif;

        display: none;

        z-index: 20;
    }

    .hidden {
        display: none !important;
    }
</style>
</head>

<body>

<div id="screen">

    <video
        id="video"
        autoplay
        playsinline>
    </video>

</div>


<div id="error"></div>


<div id="controls">

    <button id="start">
        Start
    </button>

    <select id="camera">
    </select>

    <button id="fullscreen">
        Fullscreen
    </button>

    <span id="status">
        Not connected
    </span>

</div>


<script>

let stream = null;


const video =
    document.getElementById("video");

const camera =
    document.getElementById("camera");

const controls =
    document.getElementById("controls");

const status =
    document.getElementById("status");

const errorBox =
    document.getElementById("error");



function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";

}


function hideError() {

    errorBox.style.display = "none";

}



function stopStream() {

    if (stream) {

        stream
            .getTracks()
            .forEach(track => track.stop());

    }

    stream = null;

    video.srcObject = null;

}



async function getDevices() {

    const devices =
        await navigator
            .mediaDevices
            .enumerateDevices();


    camera.innerHTML = "";


    const cameras =
        devices.filter(
            device =>
                device.kind === "videoinput"
        );


    cameras.forEach((device, index) => {

        const option =
            document.createElement("option");

        option.value =
            device.deviceId;

        option.textContent =
            device.label ||
            `Video device ${index + 1}`;

        camera.appendChild(option);

    });


    return cameras;

}



async function startCamera() {

    hideError();

    stopStream();


    try {

        /*
         * Request permission first.
         */
        await navigator.mediaDevices
            .getUserMedia({
                video: true,
                audio: false
            });


        const devices =
            await getDevices();


        if (devices.length === 0) {

            throw new Error(
                "No camera or HDMI capture device found."
            );

        }


        const selectedDevice =
            camera.value ||
            devices[0].deviceId;


        /*
         * Open the selected HDMI capture card.
         */
        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        deviceId: {
                            exact: selectedDevice
                        }
                    },

                    audio: false

                });


        video.srcObject = stream;


        /*
         * Wait until the browser knows
         * the actual video dimensions.
         */
        await new Promise(resolve => {

            if (video.readyState >= 1) {

                resolve();

            } else {

                video.onloadedmetadata =
                    resolve;

            }

        });


        await video.play();


        status.textContent =
            "Live";


        console.log(
            "Capture resolution:",
            video.videoWidth,
            "x",
            video.videoHeight
        );

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Not connected";


        showError(
            "Could not open capture device: " +
            (error.message || error.name)
        );

    }

}



/*
 * Start
 */
document
    .getElementById("start")
    .addEventListener(
        "click",
        startCamera
    );



/*
 * Change capture device
 */
camera.addEventListener(
    "change",
    startCamera
);



/*
 * Fullscreen
 */
document
    .getElementById("fullscreen")
    .addEventListener(
        "click",
        async () => {

            try {

                if (!document.fullscreenElement) {

                    await document
                        .documentElement
                        .requestFullscreen();

                } else {

                    await document
                        .exitFullscreen();

                }

            }

            catch (error) {

                showError(
                    "Fullscreen was blocked."
                );

            }

        }
    );



/*
 * Hide controls in fullscreen.
 */
document.addEventListener(
    "fullscreenchange",
    () => {

        if (document.fullscreenElement) {

            controls.classList.add(
                "hidden"
            );

        } else {

            controls.classList.remove(
                "hidden"
            );

        }

    }
);



/*
 * Load devices when page opens.
 */
window.addEventListener(
    "load",
    async () => {

        try {

            await getDevices();

        } catch (error) {

            console.log(
                "Waiting for camera permission."
            );

        }

    }
);

</script>

</body>
</html>
