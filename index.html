<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Switch Monitor</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#screen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

#video {
    display: block;

    background: black;

    /* JS will set these */
    width: 0;
    height: 0;

    max-width: none;
    max-height: none;

    object-fit: fill;
}

#controls {
    position: fixed;

    left: 50%;
    bottom: 15px;

    transform: translateX(-50%);

    background: rgba(20,20,20,.92);

    padding: 10px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    gap: 8px;

    z-index: 10;

    font-family: Arial, sans-serif;
}

button,
select {
    padding: 8px 12px;
    border: none;
    border-radius: 7px;
}

button {
    cursor: pointer;
}

#status {
    color: white;
    font-size: 13px;
}

#error {
    position: fixed;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    padding: 10px 15px;

    background: #900;
    color: white;

    border-radius: 8px;

    display: none;

    z-index: 20;

    font-family: Arial, sans-serif;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="screen">

    <video
        id="video"
        autoplay
        playsinline>
    </video>

</div>


<div id="error"></div>


<div id="controls">

    <button id="start">
        Start
    </button>

    <select id="camera"></select>

    <button id="fullscreen">
        Fullscreen
    </button>

    <span id="status">
        Not connected
    </span>

</div>


<script>

const video =
    document.getElementById("video");

const screen =
    document.getElementById("screen");

const camera =
    document.getElementById("camera");

const controls =
    document.getElementById("controls");

const status =
    document.getElementById("status");

const errorBox =
    document.getElementById("error");


let stream = null;


/* -------------------------------- */
/* Error handling */
/* -------------------------------- */

function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";

}


function hideError() {

    errorBox.style.display = "none";

}


/* -------------------------------- */
/* Stop current capture */
/* -------------------------------- */

function stopStream() {

    if (stream) {

        stream
            .getTracks()
            .forEach(track => track.stop());

    }

    stream = null;

    video.srcObject = null;

}


/* -------------------------------- */
/* Find capture devices */
/* -------------------------------- */

async function getDevices() {

    const devices =
        await navigator
            .mediaDevices
            .enumerateDevices();


    camera.innerHTML = "";


    const cameras =
        devices.filter(
            device =>
                device.kind === "videoinput"
        );


    cameras.forEach((device, index) => {

        const option =
            document.createElement("option");

        option.value =
            device.deviceId;

        option.textContent =
            device.label ||
            "Video device " + (index + 1);

        camera.appendChild(option);

    });


    return cameras;

}


/* -------------------------------- */
/* FIT VIDEO PERFECTLY */
/* -------------------------------- */

function fitVideo() {

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {
        return;
    }


    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;


    /*
     * Aspect ratio of the capture.
     */
    const videoRatio =
        videoWidth / videoHeight;


    /*
     * Aspect ratio of the screen.
     */
    const screenRatio =
        screenWidth / screenHeight;


    let width;
    let height;


    /*
     * The video is wider than the screen.
     */
    if (videoRatio > screenRatio) {

        width =
            screenWidth;

        height =
            width / videoRatio;

    }


    /*
     * The video is taller than the screen.
     */
    else {

        height =
            screenHeight;

        width =
            height * videoRatio;

    }


    /*
     * Apply the exact calculated size.
     */
    video.style.width =
        Math.round(width) + "px";

    video.style.height =
        Math.round(height) + "px";


    console.log(
        "Video:",
        videoWidth,
        "x",
        videoHeight
    );

    console.log(
        "Displayed:",
        Math.round(width),
        "x",
        Math.round(height)
    );

}


/* -------------------------------- */
/* Start capture */
/* -------------------------------- */

async function startCamera() {

    hideError();

    stopStream();


    try {

        /*
         * Ask Chrome for permission.
         */
        await navigator
            .mediaDevices
            .getUserMedia({
                video: true,
                audio: false
            });


        const devices =
            await getDevices();


        if (!devices.length) {

            throw new Error(
                "No video device found."
            );

        }


        const deviceId =
            camera.value ||
            devices[0].deviceId;


        /*
         * Open selected capture card.
         */
        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {
                        deviceId: {
                            exact: deviceId
                        }
                    },

                    audio: false

                });


        video.srcObject =
            stream;


        /*
         * Wait for video dimensions.
         */
        await new Promise(resolve => {

            if (
                video.readyState >= 1
            ) {

                resolve();

            } else {

                video.onloadedmetadata =
                    resolve;

            }

        });


        await video.play();


        /*
         * NOW calculate exact size.
         */
        fitVideo();


        status.textContent =
            "Live";


    } catch (error) {

        console.error(error);

        status.textContent =
            "Not connected";


        showError(
            "Could not open capture device: " +
            (error.message || error.name)
        );

    }

}


/* -------------------------------- */
/* Recalculate whenever screen */
/* changes size */
/* -------------------------------- */

window.addEventListener(
    "resize",
    fitVideo
);


/* -------------------------------- */
/* Buttons */
/* -------------------------------- */

document
    .getElementById("start")
    .onclick =
    startCamera;


camera.onchange =
    startCamera;


/* -------------------------------- */
/* Fullscreen */
/* -------------------------------- */

document
    .getElementById("fullscreen")
    .onclick =
    async function() {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document
                    .documentElement
                    .requestFullscreen();

            } else {

                await document
                    .exitFullscreen();

            }

        } catch (error) {

            showError(
                "Fullscreen was blocked."
            );

        }

    };


/* -------------------------------- */
/* Fullscreen changed */
/* -------------------------------- */

document.addEventListener(
    "fullscreenchange",
    function() {

        if (
            document.fullscreenElement
        ) {

            controls.classList.add(
                "hidden"
            );

        } else {

            controls.classList.remove(
                "hidden"
            );

        }


        /*
         * Recalculate after fullscreen.
         */
        setTimeout(
            fitVideo,
            100
        );

    }
);


/* -------------------------------- */
/* Initial device list */
/* -------------------------------- */

window.addEventListener(
    "load",
    async function() {

        try {

            await getDevices();

        } catch (error) {

            console.log(error);

        }

    }
);

</script>

</body>
</html>
