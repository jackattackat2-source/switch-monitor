<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Switch Monitor</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    #screen {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        background: #000;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow: hidden;
    }

    #video {
        display: block;

        width: 100%;
        height: 100%;

        object-fit: contain;
        object-position: center;

        background: #000;
    }

    #controls {
        position: fixed;

        left: 50%;
        bottom: 15px;

        transform: translateX(-50%);

        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;

        gap: 8px;

        padding: 10px 12px;

        background: rgba(20, 20, 20, 0.92);

        border-radius: 12px;

        z-index: 10;

        font-family: Arial, sans-serif;
    }

    button,
    select {
        border: none;
        border-radius: 8px;

        padding: 9px 12px;

        font-size: 14px;
    }

    button {
        cursor: pointer;
    }

    #status {
        color: white;
        font-size: 13px;
        white-space: nowrap;
    }

    #error {
        position: fixed;

        top: 15px;
        left: 50%;

        transform: translateX(-50%);

        max-width: 90vw;

        padding: 10px 15px;

        background: #900;
        color: white;

        border-radius: 8px;

        display: none;

        z-index: 20;

        font-family: Arial, sans-serif;
    }

    .hidden {
        display: none !important;
    }
</style>
</head>

<body>

<div id="screen">

    <video
        id="video"
        autoplay
        playsinline>
    </video>

</div>


<div id="error"></div>


<div id="controls">

    <button id="start">
        Start
    </button>

    <select id="camera"></select>

    <button id="fullscreen">
        Fullscreen
    </button>

    <span id="status">
        Not connected
    </span>

</div>


<script>

let stream = null;


const video =
    document.getElementById("video");

const camera =
    document.getElementById("camera");

const controls =
    document.getElementById("controls");

const status =
    document.getElementById("status");

const errorBox =
    document.getElementById("error");



function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";

}


function clearError() {

    errorBox.style.display = "none";

}



/* Stop existing video */

function stopStream() {

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

    }

    stream = null;

    video.srcObject = null;

}



/* Find video devices */

async function loadDevices() {

    const devices =
        await navigator
            .mediaDevices
            .enumerateDevices();


    camera.innerHTML = "";


    const videos =
        devices.filter(
            device =>
                device.kind === "videoinput"
        );


    videos.forEach((device, index) => {

        const option =
            document.createElement("option");

        option.value =
            device.deviceId;

        option.textContent =
            device.label ||
            `Video device ${index + 1}`;

        camera.appendChild(option);

    });


    return videos;

}



/*
 * Start the capture card.
 */

async function startCamera() {

    clearError();

    stopStream();


    try {

        /*
         * First request permission.
         * This is important on ChromeOS.
         */
        const permissionStream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    video: true,
                    audio: false
                });


        /*
         * Stop the temporary stream.
         */
        permissionStream
            .getTracks()
            .forEach(track => track.stop());


        /*
         * Now Chrome gives us the device names.
         */
        const devices =
            await loadDevices();


        if (!devices.length) {

            throw new Error(
                "No video device found."
            );

        }


        /*
         * Try to find the HDMI capture card.
         */
        let selected =
            devices.find(device => {

                const name =
                    (device.label || "")
                        .toLowerCase();

                return (
                    name.includes("capture") ||
                    name.includes("hdmi") ||
                    name.includes("usb video") ||
                    name.includes("video")
                );

            });


        /*
         * If it wasn't recognized,
         * use the currently selected device.
         */
        if (!selected) {

            selected =
                devices.find(
                    device =>
                        device.deviceId ===
                        camera.value
                );

        }


        /*
         * Otherwise use the first device.
         */
        if (!selected) {

            selected =
                devices[0];

        }


        camera.value =
            selected.deviceId;


        /*
         * Open the capture device.
         *
         * IMPORTANT:
         * We don't force a resolution.
         * The capture card chooses its
         * normal resolution.
         */
        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {
                        deviceId: {
                            exact:
                                selected.deviceId
                        }
                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        status.textContent =
            "Switch Live";


        console.log(
            "Capture:",
            video.videoWidth,
            "x",
            video.videoHeight
        );

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Not connected";

        showError(
            "Could not open capture card: " +
            (error.message || error.name)
        );

    }

}



/* Start */

document
    .getElementById("start")
    .addEventListener(
        "click",
        startCamera
    );



/* Switch capture device */

camera.addEventListener(
    "change",
    startCamera
);



/* Fullscreen */

document
    .getElementById("fullscreen")
    .addEventListener(
        "click",
        async () => {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                } else {

                    await document
                        .exitFullscreen();

                }

            }

            catch (error) {

                showError(
                    "Fullscreen was blocked."
                );

            }

        }
    );



/* Hide controls in fullscreen */

document.addEventListener(
    "fullscreenchange",
    () => {

        controls.classList.toggle(
            "hidden",
            !!document.fullscreenElement
        );

    }
);



/*
 * Load devices on startup.
 */

window.addEventListener(
    "load",
    async () => {

        try {

            await loadDevices();

        }

        catch (error) {

            console.log(error);

        }

    }
);

</script>

</body>
</html>
