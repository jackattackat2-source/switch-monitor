<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Switch Monitor</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  /* Main screen */
  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
    overflow: hidden;
  }

  /*
    Automatically fits the entire Switch picture
    to ANY screen size without cropping it.
  */
  #video {
    display: block;

    width: 100%;
    height: 100%;

    max-width: 100vw;
    max-height: 100vh;

    object-fit: contain;
    object-position: center center;

    background: #000;

    transform-origin: center center;
    transition: transform 0.15s ease;
  }

  /* Control bar */
  #controls {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);

    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;

    padding: 10px 12px;
    border-radius: 14px;

    background: rgba(20, 20, 20, 0.92);

    max-width: calc(100vw - 24px);
    z-index: 10;
  }

  button,
  select {
    border: 0;
    border-radius: 9px;
    padding: 9px 12px;
    font-size: 14px;

    background: #fff;
    color: #111;

    cursor: pointer;
  }

  button:hover {
    background: #ddd;
  }

  #status {
    font-size: 13px;
    opacity: 0.85;
  }

  #error {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);

    max-width: 90vw;
    padding: 10px 14px;

    border-radius: 10px;
    background: #8b0000;

    display: none;
    z-index: 20;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>

<body>

<div id="stage">
  <video id="video" autoplay playsinline></video>
</div>

<div id="error"></div>

<div id="controls">
  <button id="start">Start</button>

  <select id="camera" title="Video device"></select>

  <button id="mirror">Mirror: Off</button>

  <button id="rotate">Rotate: 0°</button>

  <button id="fullscreen">Fullscreen</button>

  <span id="status">
    Choose your HDMI capture device.
  </span>
</div>

<script>
let stream = null;
let mirrored = false;
let rotation = 0;

const video = document.getElementById("video");
const camera = document.getElementById("camera");
const controls = document.getElementById("controls");
const status = document.getElementById("status");
const errorBox = document.getElementById("error");


function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = "block";
}


function clearError() {
  errorBox.style.display = "none";
}


function updateTransform() {
  video.style.transform =
    `rotate(${rotation}deg) scaleX(${mirrored ? -1 : 1})`;
}


function stopStream() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  stream = null;
  video.srcObject = null;
}


async function loadDevices() {
  const devices =
    await navigator.mediaDevices.enumerateDevices();

  const oldDevice = camera.value;

  camera.innerHTML = "";

  const videoDevices =
    devices.filter(device => device.kind === "videoinput");

  videoDevices.forEach((device, index) => {
    const option = document.createElement("option");

    option.value = device.deviceId;

    option.textContent =
      device.label || `Video device ${index + 1}`;

    camera.appendChild(option);
  });

  if (
    videoDevices.some(
      device => device.deviceId === oldDevice
    )
  ) {
    camera.value = oldDevice;
  }

  return videoDevices;
}


async function startCamera() {
  clearError();
  stopStream();

  try {

    /*
      Ask Chrome for camera permission first.
      This allows the capture-card name to appear.
    */
    await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    });

    const devices = await loadDevices();

    if (!devices.length) {
      throw new Error("No video device was found.");
    }

    const deviceId =
      camera.value || devices[0].deviceId;


    /*
      Connect to the selected HDMI capture card.
    */
    stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          deviceId: {
            exact: deviceId
          }
        },
        audio: false
      });


    video.srcObject = stream;

    await video.play();

    status.textContent = "Live";
  }

  catch (error) {

    showError(
      "Could not open the capture device: " +
      (error.message || error.name)
    );

    status.textContent = "Not connected";
  }
}


/* Start button */
document
  .getElementById("start")
  .addEventListener("click", startCamera);


/* Change capture device */
camera.addEventListener("change", startCamera);


/* Mirror */
document
  .getElementById("mirror")
  .addEventListener("click", () => {

    mirrored = !mirrored;

    document.getElementById("mirror").textContent =
      `Mirror: ${mirrored ? "On" : "Off"}`;

    updateTransform();
  });


/* Rotate */
document
  .getElementById("rotate")
  .addEventListener("click", () => {

    rotation = (rotation + 90) % 360;

    document.getElementById("rotate").textContent =
      `Rotate: ${rotation}°`;

    updateTransform();
  });


/* Fullscreen */
document
  .getElementById("fullscreen")
  .addEventListener("click", async () => {

    try {

      if (!document.fullscreenElement) {

        await document.documentElement.requestFullscreen();

      } else {

        await document.exitFullscreen();

      }

    }

    catch (error) {

      showError(
        "Fullscreen was blocked by the browser."
      );

    }
  });


/*
  Hide controls while fullscreen.
*/
document.addEventListener(
  "fullscreenchange",
  () => {

    controls.classList.toggle(
      "hidden",
      Boolean(document.fullscreenElement)
    );

  }
);


/*
  Load available video devices when the page opens.
*/
window.addEventListener("load", async () => {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      "Camera access is not available here. " +
      "Open this page using HTTPS."
    );

    return;
  }

  try {

    await loadDevices();

  } catch (error) {

    /*
      Device names may not appear until
      permission has been granted.
    */

  }

});
</script>

</body>
</html>
